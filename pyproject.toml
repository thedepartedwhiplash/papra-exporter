[project]
name = "papra-exporter"
version = "1.0.0"
description = "A GUI tool for exporting multiple Papra documents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet[all]>=1.0.4",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22.3",
]

[tool.flet]
product = "Papra Exporter"
company = "Richard Morgan"
copyright = "Copyright (c) 2026 Richard Morgan"

[tool.flet.app]
module = "papra_gui"
